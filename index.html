<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eberardos Room Chat</title><link rel="icon" href="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" type="image/jpeg"><meta property="og:title" content="Eberardos Room Chat"><meta property="og:description" content="Join sini bro!"><meta property="og:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg"><meta property="og:url" content="https://ebdroomchat.vercel.app/"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Chat Komunitas"><meta name="twitter:description" content="Join sini bro!"><meta name="twitter:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet"><style>*,:after,:before{box-sizing:border-box}body,html{margin:0;padding:0}body{background:linear-gradient(135deg,#1e293b,#0f172a);height:100vh;display:flex;justify-content:center;align-items:center;font-family:Nunito,sans-serif}.chat-container{flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;height:100vh;margin:auto;background:#111827;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative}.login-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(17,24,39,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:20px;text-align:center}.login-screen h2{color:#f9fafb;margin-bottom:20px;font-size:1.8rem}.login-screen p{color:#94a3b8;margin-bottom:30px;max-width:400px;line-height:1.5}.google-btn{display:flex;align-items:center;justify-content:center;background:#fff;color:#757575;border:none;border-radius:4px;padding:12px 20px;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:background-color .3s,box-shadow .3s;margin-top:20px}.google-btn:hover{box-shadow:0 0 6px rgba(66,133,244,.5)}.google-btn:active{background:#eee}.google-icon{margin-right:12px;font-size:18px}.header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:#1f2937;color:#f9fafb;border-bottom:1px solid #374151;z-index:10}.header-left{display:flex;align-items:center;gap:12px}.header img{width:42px;height:42px;border-radius:50%;border:2px solid #38bdf8}.header h3{font-size:1.15rem;font-weight:700;letter-spacing:.5px}.user-info{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#94a3b8}.user-avatar{width:32px;height:32px;border-radius:50%}.logout-btn{background:0;border:0;color:#94a3b8;cursor:pointer;font-size:.9rem;padding:5px 10px;border-radius:4px}.logout-btn:hover{color:#f87171;background:rgba(248,113,113,.1)}.messages{flex:1;overflow-y:auto;padding:80px 15px 90px;display:flex;flex-direction:column;gap:12px;background:#0f172a;scroll-behavior:smooth}.message{display:flex;max-width:75%;gap:8px}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid #38bdf8}.message-content{padding:12px 14px;border-radius:12px;background:#1e293b;color:#f1f5f9;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s ease,background .3s ease;max-width:calc(100% - 44px)}.message-content:hover{transform:translateY(-2px);background:#273549}.message.mine .message-content{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}.message .user{font-weight:700;color:#38bdf8;font-size:.95rem;margin-bottom:4px}.message.mine .user{color:#e0f2fe}.message .timestamp{font-size:.75rem;color:#94a3b8;text-align:right;margin-top:6px}#replyPreview{display:none;position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:600px;width:100%;padding:10px 14px;background:rgba(56,189,248,.1);border-left:4px solid #38bdf8;font-size:.9rem;color:#e0f2fe;backdrop-filter:blur(8px)}#replyPreview button{position:absolute;top:6px;right:12px;background:0;border:0;font-size:1.2rem;color:#f87171;cursor:pointer}.input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:600px;width:100%;padding:12px;background:#1e293b;border-top:1px solid #334155;display:flex;gap:10px;align-items:center}textarea{flex:1;resize:none;padding:10px 12px;border:1px solid #475569;border-radius:10px;min-height:42px;max-height:120px;background:#0f172a;color:#f1f5f9;font-size:.95rem;line-height:1.4}textarea::placeholder{color:#64748b}button{padding:10px 16px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;border:0;border-radius:10px;cursor:pointer;transition:opacity .2s,transform .2s;height:42px}button:hover{opacity:.9;transform:scale(1.05)}.scroll-button{position:fixed;bottom:150px;right:20px;background:#38bdf8;color:#0f172a;border-radius:50%;width:45px;height:45px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);font-size:1.3rem;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .3s ease}.scroll-button.visible{opacity:1;transform:translateY(0);pointer-events:auto}@media (max-width:600px){.chat-container{border-radius:0}.header{padding:12px 15px}.user-info span{display:none}.message{max-width:85%}}</style></head><body><div class="chat-container"><div class="login-screen" id="loginScreen"><h2>Eberardos Community Chat</h2><p>Silakan login dengan akun Google Anda untuk bergabung dalam percakapan</p><button class="google-btn" onclick="signInWithGoogle()"><i class="fab fa-google google-icon"></i>Login dengan Google</button></div><div class="header"><div class="header-left"><img src="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" alt="Logo"><h3>Eberardos Community</h3></div><div class="user-info" id="userInfo" style="display:none"><img id="userAvatar" class="user-avatar" src="" alt="User Avatar"><span id="userName"></span><button class="logout-btn" onclick="signOut()"><i class="fas fa-sign-out-alt"></i></button></div></div><div class="messages" id="messages"></div><div id="typingStatus"></div><div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></div><div id="replyPreview"><b id="replyUser"></b>: <span id="replyText"></span><button onclick="cancelReply()" title="Batal Balas"><i class="fas fa-times"></i></button></div><div class="input-area"><textarea id="messageInput" placeholder="Ketik pesan..." disabled></textarea><button onclick="sendMessage()" title="Kirim Pesan" disabled><i class="fas fa-paper-plane"></i></button></div></div><script type="module">import{initializeApp} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";import{getDatabase,ref,push,set,onChildAdded,onChildChanged} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";import{getAuth,signInWithPopup,GoogleAuthProvider,signOut as firebaseSignOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyC7daiyJM_hu_vD6sVsJkv0bdjiTPBlx-s",authDomain:"roomchat-ebd.firebaseapp.com",databaseURL:"https://roomchat-ebd-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"roomchat-ebd",storageBucket:"roomchat-ebd.firebasestorage.app",messagingSenderId:"557680290447",appId:"1:557680290447:web:20a786f9a82195571a5efa",measurementId:"G-ZP7NYS7EHM"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);const auth=getAuth(app);const provider=new GoogleAuthProvider();const messagesRef=ref(db,"chat");const loginScreen=document.getElementById('loginScreen');const userInfo=document.getElementById('userInfo');const userAvatar=document.getElementById('userAvatar');const userName=document.getElementById('userName');const messageInput=document.getElementById('messageInput');const sendButton=document.querySelector('.input-area button');function sanitize(text){const div=document.createElement("div");div.innerHTML=text;div.querySelectorAll("iframe").forEach(i=>i.remove());return div.innerHTML}function stringToColor(str){if(!str)return"#000";let hash=0;for(let i=0;i<str.length;i++){hash=str.charCodeAt(i)+((hash<<5)-hash)}const hue=Math.abs(hash)%360;return`hsl(${hue}, 65%, 50%)`}window.signInWithGoogle=function(){signInWithPopup(auth,provider).then((result)=>{console.log("User signed in:",result.user)}).catch((error)=>{console.error("Error during sign in:",error);alert("Terjadi error saat login. Silakan coba lagi.")})};window.signOut=function(){firebaseSignOut(auth).then(()=>{console.log("User signed out")}).catch((error)=>{console.error("Error during sign out:",error)})};onAuthStateChanged(auth,(user)=>{if(user){loginScreen.style.display='none';userInfo.style.display='flex';userAvatar.src=user.photoURL;userName.textContent=user.displayName;messageInput.disabled=false;messageInput.placeholder="Ketik pesan...";sendButton.disabled=false;initChat(user)}else{loginScreen.style.display='flex';userInfo.style.display='none';messageInput.disabled=true;messageInput.placeholder="Silakan login untuk mengirim pesan";sendButton.disabled=true;document.getElementById('messages').innerHTML=''}});function initChat(user){const messagesDiv=document.getElementById("messages");const scrollBtn=document.getElementById("scrollBtn");const typingDiv=document.getElementById("typingStatus");let replyTo=null;let sending=false;let isUserAtBottom=true;let typingTimeout;messageInput.addEventListener("input",()=>{messageInput.style.height="auto";messageInput.style.height=messageInput.scrollHeight+"px";set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:true,timestamp:Date.now()});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:false,timestamp:Date.now()})},3000)});messageInput.addEventListener("keydown",(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});messagesDiv.addEventListener("scroll",()=>{const nearBottom=messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight<150;isUserAtBottom=nearBottom;scrollBtn.classList.toggle("visible",!nearBottom)});onChildAdded(messagesRef,(data)=>{const msg=data.val();if(!msg||!msg.text||!msg.user)return;const safeText=sanitize(msg.text);const msgDiv=document.createElement("div");msgDiv.className="message";if(msg.userId===user.uid)msgDiv.classList.add("mine");const time=new Date(msg.timestamp||Date.now()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});const userColor=stringToColor(msg.user);msgDiv.innerHTML=`<img class="message-avatar" src="${msg.photoURL||'https://i.ibb.co/7W0Q6vz/default-avatar.png'}" alt="${sanitize(msg.user)}" onerror="this.src='https://i.ibb.co/7W0Q6vz/default-avatar.png'"><div class="message-content"><div class="user" style="color:${userColor}">${sanitize(msg.user)}</div>${msg.replyTo?`<div style="font-size:0.85rem;color:gray;background:#f0f0f0;padding:5px;border-left:3px solid #888;margin-bottom:4px;">${sanitize(msg.replyTo)}</div>`:""}<div>${safeText}</div><div class="timestamp">${time}</div></div>`;msgDiv.addEventListener("click",()=>{replyTo=`${msg.user}: ${msg.text}`;messageInput.placeholder=`Balas ke: ${msg.user}`;document.getElementById("replyUser").textContent=msg.user;document.getElementById("replyText").textContent=msg.text;document.getElementById("replyPreview").style.display="block";messageInput.focus()});messagesDiv.appendChild(msgDiv);if(isUserAtBottom)scrollToBottom();if(messagesDiv.children.length>100)messagesDiv.removeChild(messagesDiv.firstChild)});const typingStatusRef=ref(db,"typing");onChildAdded(typingStatusRef,handleTypingUpdate);onChildChanged(typingStatusRef,handleTypingUpdate);function handleTypingUpdate(snapshot){const data=snapshot.val();if(!data||data.user===user.displayName)return;if(data.typing){typingDiv.textContent=`${data.user} sedang mengetik...`}else{typingDiv.textContent=""}}window.scrollToBottom=function(){messagesDiv.scrollTop=messagesDiv.scrollHeight};window.sendMessage=function(){if(sending)return;const text=messageInput.value.trim();if(text==="")return;sending=true;setTimeout(()=>sending=false,500);push(messagesRef,{user:user.displayName,userId:user.uid,photoURL:user.photoURL,text,timestamp:Date.now(),replyTo:replyTo});messageInput.value="";messageInput.style.height="40px";messageInput.placeholder="Ketik pesan...";replyTo=null;document.getElementById("replyPreview").style.display="none";setTimeout(scrollToBottom,100);set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:false,timestamp:Date.now()})};window.cancelReply=function(){replyTo=null;messageInput.placeholder="Ketik pesan...";document.getElementById("replyPreview").style.display="none"}}</script></body></html>
