<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eberardos Room Chat</title>
    <link rel="icon" href="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" type="image/jpeg">
    <meta property="og:title" content="Eberardos Room Chat">
    <meta property="og:description" content="Join sini bro!">
    <meta property="og:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg">
    <meta property="og:url" content="https://ebdroomchat.vercel.app/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chat Komunitas">
    <meta name="twitter:description" content="Join sini bro!">
    <meta name="twitter:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="login-screen" id="loginScreen">
            <h2>Eberardos Community Chat</h2>
            <p>Silakan login dengan akun Google Anda untuk bergabung dalam percakapan</p>
            <button class="google-btn" onclick="signInWithGoogle()">
                <i class="fab fa-google google-icon"></i>Login dengan Google
            </button>
        </div>
        
        <div class="header">
            <div class="header-left">
                <img src="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" alt="Logo">
                <h3>Eberardos</h3>
            </div>
            <div class="user-info" id="userInfo" style="display:none">
                <div class="avatar-container">
                    <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
                    <button class="avatar-change-btn" onclick="showAvatarModal()" title="Ganti Foto Profil">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                <span id="userName"></span>
                <button class="edit-btn" onclick="showNameModal()" title="Ganti Nama">
                    <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="logout-btn" onclick="signOut()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
        
        <div class="messages" id="messages"></div>
        <div id="typingStatus"></div>
        
        <div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()">
            <i class="fas fa-chevron-down"></i>
        </div>
        
        <div id="replyPreview">
            <b id="replyUser"></b>: <span id="replyText"></span>
            <button onclick="cancelReply()" title="Batal Balas">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="file-preview" id="filePreview">
            <span id="fileName"></span>
            <div id="filePreviewArea"></div>
            <button onclick="cancelUpload()" title="Batal Upload">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- Modal Preview Gambar -->
        <div class="image-modal" id="imageModal" style="display:none">
            <div class="image-modal-content">
                <img id="modalImage" src="" alt="Preview Gambar">
                <button class="modal-close" onclick="hideImageModal()">
                    <i class="fas fa-times"></i>
                </button>
                <button class="modal-download" id="modalDownload" onclick="downloadImage()" title="Download Gambar">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
        
        <div class="avatar-modal" id="avatarModal" style="display:none">
            <div class="avatar-modal-content">
                <h3>Ganti Foto Profil</h3>
                <p>Pilih foto untuk profil Anda</p>
                <div class="avatar-preview-container">
                    <img id="avatarPreview" src="" alt="Preview Avatar">
                </div>
                <input type="file" id="avatarInput" accept="image/*">
                <div class="avatar-modal-buttons">
                    <button onclick="hideAvatarModal()" style="background:var(--bg-secondary)">Batal</button>
                    <button onclick="saveAvatar()">Simpan</button>
                </div>
            </div>
        </div>
        
        <div class="name-modal" id="nameModal" style="display:none">
            <div class="name-modal-content">
                <h3>Ganti Nama Tampilan</h3>
                <p>Nama ini akan ditampilkan di chat</p>
                <input type="text" id="nameInput" maxlength="30" placeholder="Masukkan nama">
                <div class="name-modal-buttons">
                    <button onclick="hideNameModal()" style="background:var(--bg-secondary)">Batal</button>
                    <button onclick="saveDisplayName()">Simpan</button>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="file-upload-btn" title="Upload File">
                <i class="fas fa-paperclip"></i>
                <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)" accept="*/*">
            </div>
            <textarea id="messageInput" placeholder="Ketik pesan..." disabled></textarea>
            <button onclick="sendMessage()" title="Kirim Pesan" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
