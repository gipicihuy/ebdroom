<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set,
    onValue,
    onDisconnect,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBynK1eoPMjOQZAZsUxSiG7J348ENYHkNU",
    authDomain: "chatroomebd.firebaseapp.com",
    databaseURL: "https://chatroomebd-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chatroomebd",
    storageBucket: "chatroomebd.appspot.com",
    messagingSenderId: "686847521502",
    appId: "1:686847521502:web:89ea20aa523da58e85484f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "chat");
  const onlineUsersRef = ref(db, "onlineUsers");

  let userName = localStorage.getItem("chatUserName");
  while (!userName || userName.trim() === "" || userName === "Anonymous") {
    const name = prompt("👋 Halo! Masukkan nama untuk bergabung dengan chat:");
    if (name && name.trim() !== "" && name !== "Anonymous") {
      userName = name.trim();
      localStorage.setItem("chatUserName", userName);
    } else {
      alert("❌ Nama wajib diisi dan tidak boleh 'Anonymous'!");
    }
  }

  const messagesDiv = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const replyPreview = document.getElementById("replyPreview");
  const replyUser = document.getElementById("replyUser");
  const replyText = document.getElementById("replyText");
  const onlineUsersDiv = document.getElementById("onlineUsers");
  const onlineCountSpan = document.getElementById("onlineCount");

  let replyTo = null;

  // Fungsi untuk membersihkan pesan dari tag berbahaya
  function sanitizeMessage(text) {
    return text
      .replace(/<iframe.*?>.*?<\/iframe>/gi, '[IFRAME diblokir]')
      .replace(/<script.*?>.*?<\/script>/gi, '[SCRIPT diblokir]')
      .replace(/<object.*?>.*?<\/object>/gi, '[OBJECT diblokir]')
      .replace(/<embed.*?>.*?<\/embed>/gi, '[EMBED diblokir]')
      .replace(/on\w+="[^"]*"/gi, '')
      .replace(/javascript:/gi, '');
  }

  // Toggle sidebar for mobile
  window.toggleSidebar = function() {
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    sidebar.classList.toggle("open");
    overlay.classList.toggle("active");
  };

  // Set user online
  const userStatusRef = ref(db, `onlineUsers/${userName.replace(/[.#$[\]]/g, '_')}`);
  set(userStatusRef, {
    name: userName,
    lastSeen: serverTimestamp(),
    status: 'online'
  });
  onDisconnect(userStatusRef).set({
    name: userName,
    lastSeen: serverTimestamp(),
    status: 'offline'
  });

  // Online users display
  onValue(onlineUsersRef, (snapshot) => {
    const users = snapshot.val() || {};
    const onlineUsers = Object.values(users).filter(user => user.status === 'online');
    onlineUsersDiv.innerHTML = '';
    onlineCountSpan.textContent = onlineUsers.length;

    onlineUsers.forEach(user => {
      const avatarColor = getAvatarColor(user.name);
      const userDiv = document.createElement('div');
      userDiv.className = 'flex items-center gap-3 p-2 hover:bg-gray-700 rounded-lg cursor-pointer transition-colors';
      userDiv.innerHTML = `
        <div class="relative">
          <div class="w-8 h-8 md:w-10 md:h-10 rounded-full ${avatarColor} flex items-center justify-center text-white font-semibold text-sm">
            ${user.name.charAt(0).toUpperCase()}
          </div>
          <div class="online-indicator"></div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-white font-medium text-sm truncate">${user.name}</div>
          <div class="text-green-400 text-xs flex items-center gap-1">
            <i class="fas fa-circle text-xs"></i> Online
          </div>
        </div>
      `;
      onlineUsersDiv.appendChild(userDiv);
    });
  });

  // Resize textarea
  messageInput.addEventListener("input", () => {
    messageInput.style.height = "80px";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
  });

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Display messages
  onChildAdded(messagesRef, (data) => {
    const msg = data.val();
    const safeText = sanitizeMessage(msg.text);
    const isCurrentUser = msg.user === userName;
    const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString("id-ID", {
      hour: "2-digit", minute: "2-digit"
    });
    const avatarColor = getAvatarColor(msg.user);
    const msgDiv = document.createElement("div");

    if (isCurrentUser) {
      msgDiv.className = "flex justify-end message-sent";
      msgDiv.innerHTML = `
        <div class="flex items-start gap-2 flex-row-reverse">
          <div class="w-8 h-8 rounded-full ${avatarColor} flex items-center justify-center text-white font-semibold text-sm flex-shrink-0">
            ${msg.user.charAt(0).toUpperCase()}
          </div>
          <div class="message bg-red-600 text-white p-3 rounded-2xl rounded-br-md max-w-xs lg:max-w-md shadow-lg hover:shadow-xl cursor-pointer transition-all">
            <div class="font-medium text-red-100 text-sm mb-1 text-right">${msg.user}</div>
            ${msg.replyTo ? `
              <div class="text-xs bg-red-700 bg-opacity-50 p-2 rounded-lg border-l-4 border-red-400 mb-2">
                <div class="text-red-200 font-medium">${msg.replyTo.split(':')[0]}</div>
                <div class="text-red-100">${msg.replyTo.substring(msg.replyTo.indexOf(':') + 1).trim()}</div>
              </div>` : ""}
            <div class="break-words text-sm md:text-base">${safeText}</div>
            <div class="text-xs text-red-200 mt-1 text-right flex items-center justify-end gap-1">
              ${time}
              <i class="fas fa-check-double text-blue-300"></i>
            </div>
          </div>
        </div>
      `;
    } else {
      msgDiv.className = "flex items-start gap-2 message-received";
      msgDiv.innerHTML = `
        <div class="w-8 h-8 rounded-full ${avatarColor} flex items-center justify-center text-white font-semibold text-sm flex-shrink-0">
          ${msg.user.charAt(0).toUpperCase()}
        </div>
        <div class="message bg-gray-700 text-white p-3 rounded-2xl rounded-bl-md max-w-xs lg:max-w-md shadow-lg hover:shadow-xl cursor-pointer transition-all">
          <div class="font-medium text-red-400 text-sm mb-1">${msg.user}</div>
          ${msg.replyTo ? `
            <div class="text-xs bg-gray-600 p-2 rounded-lg border-l-4 border-gray-500 mb-2">
              <div class="text-gray-300 font-medium">${msg.replyTo.split(':')[0]}</div>
              <div class="text-gray-400">${msg.replyTo.substring(msg.replyTo.indexOf(':') + 1).trim()}</div>
            </div>` : ""}
          <div class="break-words text-sm md:text-base">${safeText}</div>
          <div class="text-xs text-gray-400 mt-1 text-right">${time}</div>
        </div>
      `;
    }

    // Click to reply
    const messageElement = msgDiv.querySelector('.message');
    messageElement.addEventListener("click", () => {
      replyTo = `${msg.user}: ${safeText}`;
      replyUser.textContent = msg.user;
      replyText.textContent = safeText;
      replyPreview.classList.remove("hidden");
      messageInput.focus();
    });

    messagesDiv.appendChild(msgDiv);
    const messagesContainer = document.querySelector('.messages-container');
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  });

  // Send message function
  window.sendMessage = function() {
    const text = messageInput.value.trim();
    if (text === "") return;

    push(messagesRef, {
      user: userName,
      text: text,
      timestamp: Date.now(),
      replyTo: replyTo
    });

    messageInput.value = "";
    messageInput.style.height = "80px";
    replyTo = null;
    replyPreview.classList.add("hidden");
  };

  // Cancel reply
  window.cancelReply = function() {
    replyTo = null;
    replyPreview.classList.add("hidden");
  };

  // Avatar warna dinamis
  function getAvatarColor(name) {
    const colors = ["bg-red-500", "bg-green-500", "bg-blue-500", "bg-yellow-500", "bg-pink-500", "bg-purple-500", "bg-indigo-500"];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }
</script>
