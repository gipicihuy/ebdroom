<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eberardos Room Chat</title>
  <link rel="icon" href="https://qu.ax/lElwH.jpg" type="image/jpeg" />
  <meta property="og:title" content="Eberardos Room Chat" />
  <meta property="og:description" content="Join sini bro!" />
  <meta property="og:image" content="https://qu.ax/lElwH.jpg" />
  <meta property="og:url" content="https://ebdroomchat.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chat Komunitas" />
  <meta name="twitter:description" content="Join sini bro!" />
  <meta name="twitter:image" content="https://qu.ax/lElwH.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary: #FF6B6B;
      --primary-dark: #FF2E63;
      --secondary: #08D9D6;
      --dark: #252A34;
      --light: #EAEAEA;
      --accent: #FFD166;
      --retro-blue: #00BBF0;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'VT323', monospace; 
    }
    
    .messages img, .messages video {
      all: unset;
      max-width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 0;
      border: 3px solid var(--dark);
      margin: 8px 0;
    }
    
    body {
      background: repeating-linear-gradient(
        45deg,
        var(--light),
        var(--light) 20px,
        #e0e0e0 20px,
        #e0e0e0 40px
      );
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: auto;
      background: white;
      border: 4px solid var(--dark);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 8px 8px 0 var(--dark);
      position: relative;
    }
    
    .header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: var(--dark);
      color: var(--accent);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      border-bottom: 4px solid var(--dark);
      font-family: 'Ubuntu Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 0;
      border: 3px solid var(--accent);
      object-fit: cover;
      image-rendering: pixelated;
    }
    
    .header h3 {
      font-size: 1.5rem;
      font-weight: 700;
      text-shadow: 2px 2px 0 var(--primary);
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 80px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--light);
      scroll-behavior: smooth;
      background-image: 
        linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)),
        url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="1" height="1" fill="black" opacity="0.1"/></svg>');
    }
    
    #typingStatus {
      font-size: 1.1rem;
      color: var(--primary-dark);
      margin: -8px 0 8px;
      padding: 0 16px;
      font-style: italic;
      height: 24px;
    }
    
    .message {
      background: white;
      user-select: none;
      padding: 12px;
      border-radius: 0;
      max-width: 80%;
      box-shadow: 4px 4px 0 var(--dark);
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
      border: 3px solid var(--dark);
      transform: translate(0, 0);
    }
    
    .message:hover { 
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--dark);
    }
    
    .message .user {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1.3rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Ubuntu Mono', monospace;
    }
    
    .message .user::before {
      content: ">";
      display: inline-block;
      color: var(--secondary);
    }
    
    .message .timestamp {
      font-size: 0.9rem;
      color: var(--dark);
      text-align: right;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      opacity: 0.7;
    }
    
    #replyPreview {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      padding: 12px;
      background: var(--accent);
      border: 3px solid var(--dark);
      font-size: 1.1rem;
      z-index: 99;
      box-shadow: 4px 4px 0 var(--dark);
    }
    
    #replyPreview button {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--primary-dark);
      cursor: pointer;
      transition: transform 0.1s;
    }
    
    #replyPreview button:hover {
      transform: scale(1.2);
    }
    
    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      padding: 12px;
      background: white;
      border-top: 4px solid var(--dark);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -4px 0 var(--dark);
    }
    
    textarea {
      flex: 1;
      resize: none;
      padding: 12px;
      border: 3px solid var(--dark);
      border-radius: 0;
      min-height: 60px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 1.2rem;
      line-height: 1.4;
      transition: all 0.1s;
      background: white;
      box-shadow: inset 4px 4px 0 var(--dark);
      font-family: 'VT323', monospace;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: inset 4px 4px 0 var(--primary);
    }
    
    button {
      padding: 0;
      background: var(--primary);
      color: var(--dark);
      border: 3px solid var(--dark);
      border-radius: 0;
      cursor: pointer;
      transition: all 0.1s;
      height: 60px;
      width: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 4px 4px 0 var(--dark);
    }
    
    button:hover { 
      background: var(--primary-dark);
      color: white;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--dark);
    }
    
    button:active {
      transform: translate(0, 0);
      box-shadow: 4px 4px 0 var(--dark);
    }
    
    .scroll-button {
      position: fixed;
      bottom: 160px;
      right: 20px;
      background: var(--secondary);
      color: var(--dark);
      border-radius: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--dark);
      font-size: 1.8rem;
      z-index: 100;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 3px solid var(--dark);
    }
    
    .scroll-button.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    .scroll-button:hover {
      background: var(--retro-blue);
      transform: translate(-2px, -2px) scale(1.05);
      box-shadow: 6px 6px 0 var(--dark);
    }
    
    @media screen and (max-width: 600px) {
      .chat-container { 
        width: 100%; 
        height: 100%; 
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      
      .header {
        border-radius: 0;
      }
      
      .message {
        max-width: 85%;
      }
    }
    
    /* Animation for new messages */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }
    
    .message.new {
      animation: glitch 0.3s linear;
    }
    
    /* Retro scanlines effect */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.1) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1000;
      mix-blend-mode: overlay;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <img src="https://qu.ax/lElwH.jpg" alt="Logo"/>
    <h3>Eberardos Community</h3>
  </div>

  <div class="messages" id="messages"></div>
  <div id="typingStatus"></div>

  <div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()">
    <i class="fas fa-arrow-down"></i>
  </div>

  <div id="replyPreview">
    <b id="replyUser"></b>: <span id="replyText"></span>
    <button onclick="cancelReply()" title="Batal Balas"><i class="fas fa-times"></i></button>
  </div>

  <div class="input-area">
    <textarea id="messageInput" placeholder="Ketik pesan..."></textarea>
    <button onclick="sendMessage()" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
