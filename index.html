<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eberardos Room Chat</title>
  <link rel="icon" href="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" type="image/jpeg" />
  <meta property="og:title" content="Eberardos Room Chat" />
  <meta property="og:description" content="Join sini bro!" />
  <meta property="og:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" />
  <meta property="og:url" content="https://ebdroomchat.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chat Komunitas" />
  <meta name="twitter:description" content="Join sini bro!" />
  <meta name="twitter:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Nunito', sans-serif;
}

body {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 600px;
  width: 100%;
  height: 100vh;
  margin: auto;
  background: #111827;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 20px;
  background: #1f2937;
  color: #f9fafb;
  border-bottom: 1px solid #374151;
  z-index: 10;
}
.header img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid #38bdf8;
}
.header h3 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* MESSAGES AREA */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 80px 15px 90px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #0f172a;
  scroll-behavior: smooth;
}
.message {
  max-width: 75%;
  padding: 12px 14px;
  border-radius: 12px;
  background: #1e293b;
  color: #f1f5f9;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  transition: transform .2s ease, background .3s ease;
}
.message:hover { transform: translateY(-2px); background: #273549; }
.message .user {
  font-weight: 700;
  color: #38bdf8;
  font-size: 0.95rem;
  margin-bottom: 4px;
}
.message .timestamp {
  font-size: 0.75rem;
  color: #94a3b8;
  text-align: right;
  margin-top: 6px;
}

/* REPLY PREVIEW */
#replyPreview {
  display: none;
  position: fixed;
  bottom: 95px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 600px;
  width: 100%;
  padding: 10px 14px;
  background: rgba(56, 189, 248, 0.1);
  border-left: 4px solid #38bdf8;
  font-size: 0.9rem;
  color: #e0f2fe;
  backdrop-filter: blur(8px);
}
#replyPreview button {
  position: absolute;
  top: 6px;
  right: 12px;
  background: none;
  border: none;
  font-size: 1.2rem;
  color: #f87171;
  cursor: pointer;
}

/* INPUT AREA */
.input-area {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  max-width: 600px;
  width: 100%;
  padding: 12px;
  background: #1e293b;
  border-top: 1px solid #334155;
  display: flex;
  gap: 10px;
  align-items: center;
}
textarea {
  flex: 1;
  resize: none;
  padding: 10px 12px;
  border: 1px solid #475569;
  border-radius: 10px;
  min-height: 42px;
  max-height: 120px;
  background: #0f172a;
  color: #f1f5f9;
  font-size: 0.95rem;
  line-height: 1.4;
}
textarea::placeholder { color: #64748b; }
button {
  padding: 10px 16px;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
  height: 42px;
}
button:hover { opacity: 0.9; transform: scale(1.05); }

/* SCROLL BUTTON */
.scroll-button {
  position: fixed;
  bottom: 150px;
  right: 20px;
  background: #38bdf8;
  color: #0f172a;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  font-size: 1.3rem;
  z-index: 100;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: all 0.3s ease;
}
.scroll-button.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* MEDIA */
@media screen and (max-width: 600px) {
  .chat-container { border-radius: 0; }
}
  </style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <img src="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" alt="Logo"/>
    <h3>Eberardos Community</h3>
  </div>

  <div class="messages" id="messages"></div>
  <div id="typingStatus"></div>

  <div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()">
    <i class="fas fa-chevron-down"></i>
  </div>

  <div id="replyPreview">
    <b id="replyUser"></b>: <span id="replyText"></span>
    <button onclick="cancelReply()" title="Batal Balas"><i class="fas fa-times"></i></button>
  </div>

  <div class="input-area">
    <textarea id="messageInput" placeholder="Ketik pesan..."></textarea>
    <button onclick="sendMessage()" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
