<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eberardos Room Chat</title>
  <link rel="icon" href="https://qu.ax/lElwH.jpg" type="image/jpeg" />
  <meta property="og:title" content="Eberardos Room Chat" />
  <meta property="og:description" content="Join sini bro!" />
  <meta property="og:image" content="https://qu.ax/lElwH.jpg" />
  <meta property="og:url" content="https://ebdroomchat.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chat Komunitas" />
  <meta name="twitter:description" content="Join sini bro!" />
  <meta name="twitter:image" content="https://qu.ax/lElwH.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background: #e4ecf2;
      height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: auto;
      background: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .header {
      display: flex;
      align-items: center;
      background: #656464;
      color: white;
      padding: 15px;
      gap: 10px;
    }

    .header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .header h3 {
      font-size: 1.2rem;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 75%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }

    .message .user {
      font-weight: bold;
      color: #007bff;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .reply-box {
      font-size: 0.8rem;
      background:#e8f0ff;
      padding:4px 8px;
      border-left:3px solid #007bff;
      margin-bottom:5px;
      color: #444;
      margin-left: 10px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fafafa;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 8px;
      min-height: 40px;
      max-height: 120px;
      overflow-y: auto;
    }

    button {
      padding: 10px 16px;
      border: none;
      background: #656464;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    @media screen and (max-width: 600px) {
      .chat-container {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <img src="https://qu.ax/lElwH.jpg" alt="Logo"/>
    <h3>Eberardos Community</h3>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea id="messageInput" placeholder="Ketik pesan..." oninput="autoResize(this)"></textarea>
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import {
    getDatabase,
    ref,
    push,
    onChildAdded
  } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBynK1eoPMjOQZAZsUxSiG7J348ENYHkNU",
    authDomain: "chatroomebd.firebaseapp.com",
    databaseURL: "https://chatroomebd-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chatroomebd",
    storageBucket: "chatroomebd.appspot.com",
    messagingSenderId: "686847521502",
    appId: "1:686847521502:web:89ea20aa523da58e85484f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "chat");

  let userName = localStorage.getItem("chatUserName");
  while (!userName || userName.trim() === "" || userName === "Anonymous") {
    alert("Nama wajib diisi untuk ikut chat.");
    userName = prompt("Masukkan nama kamu (wajib):");
  }
  localStorage.setItem("chatUserName", userName);

  const messagesDiv = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");

  messageInput.addEventListener("input", () => {
    messageInput.style.height = "auto";
    messageInput.style.height = messageInput.scrollHeight + "px";
  });

  let replyingTo = null;

  window.sendMessage = function () {
    const text = messageInput.value.trim();
    if (text === "") return;

    const data = {
      user: userName,
      text,
      timestamp: Date.now()
    };

    if (replyingTo) {
      data.replyTo = replyingTo;
    }

    push(messagesRef, data);
    messageInput.value = "";
    messageInput.style.height = "40px";
    messageInput.placeholder = "Ketik pesan...";
    replyingTo = null;
  };

  messagesDiv.addEventListener("click", (e) => {
    const msgDiv = e.target.closest(".message");
    if (!msgDiv) return;
    const user = msgDiv.dataset.user;
    const text = msgDiv.dataset.text;
    replyingTo = { user, text };
    messageInput.placeholder = `Balas ke ${user}: "${text}"`;
    messageInput.focus();
  });

  onChildAdded(messagesRef, (data) => {
    const msg = data.val();

    const safeText = msg.text.replace(/<iframe.*?>.*?<\/iframe>/gi, '[IFRAME diblokir]');

    const msgDiv = document.createElement("div");
    msgDiv.className = "message";
    msgDiv.dataset.user = msg.user;
    msgDiv.dataset.text = msg.text;

    let replyHtml = "";
    if (msg.replyTo) {
      replyHtml = `
        <div class="reply-box">
          <b>${msg.replyTo.user}</b>: "${msg.replyTo.text}"
        </div>
      `;
    }

    const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit"
    });

    msgDiv.innerHTML = `
      <div class="user">${msg.user}</div>
      ${replyHtml}
      <div>${safeText}</div>
      <div style="font-size: 0.75rem; color: gray; text-align: right;">${time}</div>
    `;

    messagesDiv.appendChild(msgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  window.autoResize = function (el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
</script>

</body>
</html>
