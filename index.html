<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eberardos Room Chat</title>
  <link rel="icon" href="https://qu.ax/lElwH.jpg" type="image/jpeg" />
  <meta property="og:title" content="Eberardos Room Chat" />
  <meta property="og:description" content="Join sini bro!" />
  <meta property="og:image" content="https://qu.ax/lElwH.jpg" />
  <meta property="og:url" content="https://ebdroomchat.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chat Komunitas" />
  <meta name="twitter:description" content="Join sini bro!" />
  <meta name="twitter:image" content="https://qu.ax/lElwH.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
    .messages img, .messages video {
      all: unset;
      max-width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 8px;
    }
    body {
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: #1f2937;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    .header h3 {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 70px 15px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f9fafb;
      scroll-behavior: smooth;
    }
    .message {
      background: #ffffff;
      user-select: none;
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 75%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .message:hover { transform: scale(1.01); }
    .message .user {
      font-weight: bold;
      color: #1d4ed8;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .message .timestamp {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: right;
      margin-top: 4px;
    }
    #replyPreview {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      padding: 10px 16px;
      background: #e0f2fe;
      border-left: 4px solid #0ea5e9;
      font-size: 0.9rem;
      z-index: 99;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #replyPreview button {
      position: absolute;
      top: 5px;
      right: 10px;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #ef4444;
      cursor: pointer;
    }
    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      padding: 10px;
      background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      min-height: 40px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    button {
      padding: 10px 16px;
      background: #1f2937;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      height: 40px;
    }
    button:hover { background: #111827; }
    .scroll-button {
      position: fixed;
      bottom: 160px;
      right: 20px;
      background: #1f2937;
      color: white;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 1.4rem;
      z-index: 100;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .scroll-button.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    @media screen and (max-width: 600px) {
      .chat-container { width: 100%; height: 100%; border-radius: 0; }
    }
    #userListModal {
      display:none;
      position:fixed;
      top:100px;
      right:10px;
      background:white;
      padding:16px;
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.2);
      z-index:200;
      min-width: 180px;
    }
    #userListModal h4 { margin-bottom: 10px; }
    #userList li { margin-bottom: 6px; }
    #userList button {
      margin-left: 8px;
      background: #0ea5e9;
      color: white;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 0.9em;
      height: auto;
    }
    #adminUserList {
      position:fixed;
      top:70px;
      right:10px;
      z-index:101;
      background: #0ea5e9;
      color: white;
      border-radius: 8px;
      border: none;
      padding: 6px 12px;
      font-size: 1em;
    }
    #messageInput.locked {
      background-color: #f0f0f0;
      color: #888;
      cursor: not-allowed;
      background-image: url('https://cdn-icons-png.flaticon.com/512/565/565547.png');
      background-size: 20px;
      background-repeat: no-repeat;
      background-position: 10px center;
      padding-left: 40px;
      height: 40px;
      line-height: 20px;
      font-size: 14px;
    }
    #messageInput.locked::placeholder {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <img src="https://qu.ax/lElwH.jpg" alt="Logo"/>
    <h3>Eberardos Community</h3>
  </div>

  <div class="messages" id="messages"></div>
  <div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()">
    <i class="fas fa-chevron-down"></i>
  </div>

  <div id="replyPreview">
    <b id="replyUser"></b>: <span id="replyText"></span>
    <button onclick="cancelReply()" title="Batal Balas"><i class="fas fa-times"></i></button>
  </div>

  <div class="input-area">
    <textarea id="messageInput" placeholder="Ketik pesan..."></textarea>
    <button onclick="sendMessage()" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<button id="adminUserList">👤 User List</button>
<div id="userListModal">
  <h4>Daftar User</h4>
  <ul id="userList"></ul>
  <button onclick="document.getElementById('userListModal').style.display='none'">Tutup</button>
</div>

<script>
  // Chat lock at night (22.00-05.00)
  const jam = new Date().getHours();
  const isNight = (jam >= 22 || jam < 5);
  if (isNight) {
    window.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("messageInput");
      const btn = document.querySelector(".input-area button");
      if (input) {
        input.classList.add("locked");
        input.placeholder = "Chat is locked by Owner";
        input.disabled = true;
      }
      if (btn) {
        btn.disabled = false;
        btn.onclick = () => { alert("Gabisa njing"); };
      }
    });
  }
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://your-db-url",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const chatRef = ref(db, "messages");
  const usersRef = ref(db, "users");

  const chatBox = document.getElementById("chatBox");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const userName = localStorage.getItem("username") || prompt("Masukkan username:");
  localStorage.setItem("username", userName);

  const userId = localStorage.getItem("userId") || Date.now().toString();
  localStorage.setItem("userId", userId);

  update(ref(db, "users/" + userId), { user: userName });

  const userMap = {};

  onValue(usersRef, snap => {
    snap.forEach(child => {
      userMap[child.key] = child.val().user;
    });
  });

  function sanitize(str) {
    const temp = document.createElement("div");
    temp.textContent = str;
    return temp.innerHTML;
  }

  onValue(chatRef, snap => {
    chatBox.innerHTML = "";
    snap.forEach(child => {
      const data = child.val();
      const msgId = child.key;
      const displayName = data.user || "Unknown";
      const replyText = data.reply ? `<div class="reply">Balasan ke: ${sanitize(data.reply)}</div>` : "";
      const isMine = data.userId === userId;
      const msgClass = isMine ? "message mine" : "message";

      chatBox.innerHTML += `
        <div class="${msgClass}">
          <div class="name">${displayName}</div>
          ${replyText}
          <div class="text">${sanitize(data.text)}</div>
          <button onclick="replyTo('${sanitize(data.text)}')">↪</button>
        </div>
      `;
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  window.replyTo = function (text) {
    messageInput.setAttribute("data-reply", text);
    messageInput.placeholder = `Balas ke: ${text}`;
  };

  sendBtn.onclick = function () {
    const text = messageInput.value.trim();
    const reply = messageInput.getAttribute("data-reply");

    if (text !== "") {
      const msg = {
        text: text,
        user: userName,
        userId: userId,
        reply: reply || null,
        timestamp: Date.now()
      };
      push(chatRef, msg);
      messageInput.value = "";
      messageInput.removeAttribute("data-reply");
      messageInput.placeholder = "Ketik pesan...";
    }
  };

  // 🔒 Kunci input saat malam hari
  const jam = new Date().getHours();
  const isNight = (jam >= 22 || jam < 5);
  if (isNight) {
    window.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("messageInput");
      const btn = document.querySelector(".input-area button");

      if (input) {
        input.classList.add("locked");
        input.placeholder = "🔒 Chat terkunci karena sudah malam...";
        input.disabled = true;
      }

      if (btn) {
        btn.disabled = false;
        btn.onclick = () => {
          alert("🔒 Chat tidak tersedia malam hari. Silakan kembali besok pagi!");
        };
      }
    });
  }

  // 🛠 Admin Panel
  const adminBtn = document.getElementById("adminUserList");
  const userListModal = document.getElementById("userListModal");
  const userListUl = document.getElementById("userList");

  if (userName !== "gipicihuy") {
    adminBtn.style.display = "none";
  }

  adminBtn.onclick = function () {
    onValue(usersRef, snap => {
      userListUl.innerHTML = "";
      snap.forEach(child => {
        const data = child.val();
        const key = child.key;
        const encodedName = encodeURIComponent(data.user);

        const li = document.createElement("li");
        li.innerHTML = `
          <span>${sanitize(data.user)}</span>
          <button onclick="editUser('${key}', decodeURIComponent('${encodedName}'))">Edit</button>
        `;
        userListUl.appendChild(li);
      });
      userListModal.style.display = "block";
    });
  };

  window.editUser = function (key, oldName) {
    const newName = prompt("Ubah nama user:", oldName);
    if (newName && newName.trim() !== "" && newName !== oldName) {
      update(ref(db, "users/" + key), { user: newName });
      alert("Username diubah!");
    }
  };
</script>
</body>
