<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eberardos Room Chat</title><link rel="icon" href="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" type="image/jpeg"><meta property="og:title" content="Eberardos Room Chat"><meta property="og:description" content="Join sini bro!"><meta property="og:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg"><meta property="og:url" content="https://ebdroomchat.vercel.app/"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Chat Komunitas"><meta name="twitter:description" content="Join sini bro!"><meta name="twitter:image" content="https://i.ibb.co/xcqmzxt/20250818-192240.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg-primary:#0f0f13;--bg-secondary:#1a1b23;--bg-tertiary:#252736;--accent-primary:#7b68ee;--accent-secondary:#5e4fcc;--text-primary:#f0f0f5;--text-secondary:#a0a0b0;--text-muted:#6a6a7a;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--admin-badge:linear-gradient(135deg,#f59e0b,#d97706);--user-message:linear-gradient(135deg,#7b68ee,#6a5acd);--other-message:#2d2e3f;--border-radius:16px;--border-radius-sm:10px;--shadow:0 10px 25px rgba(0,0,0,.3);--transition:all .3s cubic-bezier(.4,0,.2,1)}*,::after,::before{box-sizing:border-box}body,html{margin:0;padding:0;height:100%;font-family:Inter,sans-serif}body{background:var(--bg-primary);display:flex;justify-content:center;align-items:center;color:var(--text-primary)}.chat-container{flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;height:100vh;margin:auto;background:var(--bg-secondary);border-radius:var(--border-radius);overflow:hidden;box-shadow:var(--shadow);position:relative}.login-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,15,19,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:20px;text-align:center;backdrop-filter:blur(10px)}.login-screen h2{color:var(--text-primary);margin-bottom:20px;font-size:1.8rem;font-weight:700}.login-screen p{color:var(--text-secondary);margin-bottom:30px;max-width:400px;line-height:1.5;font-weight:400}.google-btn{display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);color:var(--text-primary);border:none;border-radius:var(--border-radius-sm);padding:14px 24px;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:var(--transition);margin-top:20px}.google-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(123,104,238,.3);background:var(--accent-secondary)}.google-icon{margin-right:12px;font-size:18px}.header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--bg-tertiary);color:var(--text-primary);border-bottom:1px solid rgba(255,255,255,.08);z-index:10;backdrop-filter:blur(8px)}.header-left{display:flex;align-items:center;gap:12px}.header img{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent-primary);object-fit:cover}.header h3{font-size:1.15rem;font-weight:700;letter-spacing:.5px}.user-info{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text-secondary)}.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}.logout-btn{background:transparent;border:0;color:var(--text-secondary);cursor:pointer;font-size:.9rem;padding:6px 10px;border-radius:var(--border-radius-sm);transition:var(--transition)}.logout-btn:hover{color:var(--danger);background:rgba(239,68,68,.1)}.messages{flex:1;overflow-y:auto;padding:80px 15px 90px;display:flex;flex-direction:column;gap:16px;background:var(--bg-primary);scroll-behavior:smooth;background-image:radial-gradient(circle at 25% 25%,rgba(123,104,238,.05) 0,transparent 40%),radial-gradient(circle at 75% 75%,rgba(94,79,204,.05) 0,transparent 40%)}.message{display:flex;max-width:80%;gap:12px;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--accent-primary);align-self:flex-end}.message-content{position:relative;padding:14px 16px;border-radius:18px;background:var(--other-message);color:var(--text-primary);box-shadow:0 4px 12px rgba(0,0,0,.2);transition:var(--transition);max-width:calc(100% - 50px)}.message-content:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25)}.message.mine .message-content{background:var(--user-message);color:#fff}.message .user{font-weight:600;color:var(--accent-primary);font-size:.95rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}.message.mine .user{color:rgba(255,255,255,.9)}.message .timestamp{font-size:.75rem;color:var(--text-muted);text-align:right;margin-top:6px}.message.mine .timestamp{color:rgba(255,255,255,.7)}.admin-badge{background:var(--admin-badge);color:#fff;font-size:.7rem;padding:3px 8px;border-radius:6px;font-weight:600;margin-left:6px}.message-actions{position:absolute;top:8px;right:8px;opacity:0;transition:var(--transition)}.message-content:hover .message-actions{opacity:1}.delete-btn{background:rgba(239,68,68,.2);border:none;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--danger);font-size:.7rem;transition:var(--transition)}.delete-btn:hover{background:rgba(239,68,68,.3);transform:scale(1.1)}.deleted-message{font-style:italic;color:var(--text-muted)!important;background:rgba(160,160,176,.1)!important}.deleted-message .message-content{background:transparent!important}#replyPreview{display:none;position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:600px;width:100%;padding:12px 16px;background:rgba(123,104,238,.15);border-left:4px solid var(--accent-primary);font-size:.9rem;color:var(--text-primary);backdrop-filter:blur(8px);border-radius:var(--border-radius-sm)}#replyPreview button{position:absolute;top:8px;right:12px;background:0;border:0;font-size:1.2rem;color:var(--danger);cursor:pointer;transition:var(--transition)}#replyPreview button:hover{transform:scale(1.1)}.input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:600px;width:100%;padding:16px;background:var(--bg-tertiary);border-top:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center;backdrop-filter:blur(8px)}textarea{flex:1;resize:none;padding:12px 16px;border:1px solid rgba(255,255,255,.1);border-radius:var(--border-radius-sm);min-height:46px;max-height:120px;background:var(--bg-secondary);color:var(--text-primary);font-size:.95rem;line-height:1.4;transition:var(--transition)}textarea:focus{outline:none;border-color:var(--accent-primary);box-shadow:0 0 0 2px rgba(123,104,238,.2)}textarea::placeholder{color:var(--text-muted)}button{padding:12px 18px;background:var(--user-message);color:#fff;border:0;border-radius:var(--border-radius-sm);cursor:pointer;transition:var(--transition);height:46px;display:flex;align-items:center;justify-content:center}button:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(123,104,238,.3)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.scroll-button{position:fixed;bottom:150px;right:20px;background:var(--accent-primary);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:1.3rem;z-index:100;opacity:0;transform:translateY(10px);pointer-events:none;transition:var(--transition)}.scroll-button.visible{opacity:1;transform:translateY(0);pointer-events:auto}.scroll-button:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px rgba(123,104,238,.4)}@media (max-width:600px){.chat-container{border-radius:0}.header{padding:12px 16px}.user-info span{display:none}.message{max-width:88%}.input-area{padding:12px}.scroll-button{bottom:130px;right:15px;width:44px;height:44px}.message-actions{opacity:1}}</style></head><body><div class="chat-container"><div class="login-screen" id="loginScreen"><h2>Eberardos Community Chat</h2><p>Silakan login dengan akun Google Anda untuk bergabung dalam percakapan</p><button class="google-btn" onclick="signInWithGoogle()"><i class="fab fa-google google-icon"></i>Login dengan Google</button></div><div class="header"><div class="header-left"><img src="https://i.ibb.co/xcqmzxt/20250818-192240.jpg" alt="Logo"><h3>Eberardos Community</h3></div><div class="user-info" id="userInfo" style="display:none"><img id="userAvatar" class="user-avatar" src="" alt="User Avatar"><span id="userName"></span><button class="logout-btn" onclick="signOut()"><i class="fas fa-sign-out-alt"></i></button></div></div><div class="messages" id="messages"></div><div id="typingStatus"></div><div class="scroll-button" id="scrollBtn" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></div><div id="replyPreview"><b id="replyUser"></b>: <span id="replyText"></span><button onclick="cancelReply()" title="Batal Balas"><i class="fas fa-times"></i></button></div><div class="input-area"><textarea id="messageInput" placeholder="Ketik pesan..." disabled></textarea><button onclick="sendMessage()" title="Kirim Pesan" disabled><i class="fas fa-paper-plane"></i></button></div></div><script type="module">import{initializeApp} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";import{getDatabase,ref,push,set,onChildAdded,onChildChanged,remove,update} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";import{getAuth,signInWithPopup,GoogleAuthProvider,signOut as firebaseSignOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyC7daiyJM_hu_vD6sVsJkv0bdjiTPBlx-s",authDomain:"roomchat-ebd.firebaseapp.com",databaseURL:"https://roomchat-ebd-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"roomchat-ebd",storageBucket:"roomchat-ebd.firebasestorage.app",messagingSenderId:"557680290447",appId:"1:557680290447:web:20a786f9a82195571a5efa",measurementId:"G-ZP7NYS7EHM"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);const auth=getAuth(app);const provider=new GoogleAuthProvider();const messagesRef=ref(db,"chat");const loginScreen=document.getElementById('loginScreen');const userInfo=document.getElementById('userInfo');const userAvatar=document.getElementById('userAvatar');const userName=document.getElementById('userName');const messageInput=document.getElementById('messageInput');const sendButton=document.querySelector('.input-area button');const adminUsers={"dnzobro@gmail.com":true,"user2@example.com":true,"admin@eberardos.com":true};function sanitize(text){const div=document.createElement("div");div.innerHTML=text;div.querySelectorAll("iframe").forEach(i=>i.remove());return div.innerHTML}function stringToColor(str){if(!str)return"#000";let hash=0;for(let i=0;i<str.length;i++){hash=str.charCodeAt(i)+((hash<<5)-hash)}const hue=Math.abs(hash)%360;return`hsl(${hue}, 65%, 50%)`}function isAdmin(userEmail){return userEmail&&adminUsers[userEmail]===true}window.signInWithGoogle=function(){signInWithPopup(auth,provider).then((result)=>{console.log("User signed in:",result.user)}).catch((error)=>{console.error("Error during sign in:",error);alert("Terjadi error saat login. Silakan coba lagi.")})};window.signOut=function(){firebaseSignOut(auth).then(()=>{console.log("User signed out")}).catch((error)=>{console.error("Error during sign out:",error)})};onAuthStateChanged(auth,(user)=>{if(user){loginScreen.style.display='none';userInfo.style.display='flex';userAvatar.src=user.photoURL;userName.textContent=user.displayName;messageInput.disabled=false;messageInput.placeholder="Ketik pesan...";sendButton.disabled=false;initChat(user)}else{loginScreen.style.display='flex';userInfo.style.display='none';messageInput.disabled=true;messageInput.placeholder="Silakan login untuk mengirim pesan";sendButton.disabled=true;document.getElementById('messages').innerHTML=''}});function initChat(user){const messagesDiv=document.getElementById("messages");const scrollBtn=document.getElementById("scrollBtn");const typingDiv=document.getElementById("typingStatus");let replyTo=null;let sending=false;let isUserAtBottom=true;let typingTimeout;messageInput.addEventListener("input",()=>{messageInput.style.height="auto";messageInput.style.height=messageInput.scrollHeight+"px";set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:true,timestamp:Date.now()});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:false,timestamp:Date.now()})},3000)});messageInput.addEventListener("keydown",(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});messagesDiv.addEventListener("scroll",()=>{const nearBottom=messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight<150;isUserAtBottom=nearBottom;scrollBtn.classList.toggle("visible",!nearBottom)});onChildAdded(messagesRef,(data)=>{const msg=data.val();if(!msg)return;const safeText=msg.deleted?"Pesan ini telah dihapus":sanitize(msg.text||"");const msgDiv=document.createElement("div");msgDiv.className="message";if(msg.userId===user.uid)msgDiv.classList.add("mine");if(msg.deleted)msgDiv.classList.add("deleted-message");const time=new Date(msg.timestamp||Date.now()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});const userColor=stringToColor(msg.user);const isUserAdmin=isAdmin(msg.email);msgDiv.innerHTML=`<img class="message-avatar" src="${msg.photoURL||'https://i.ibb.co/7W0Q6vz/default-avatar.png'}" alt="${sanitize(msg.user)}" onerror="this.src='https://i.ibb.co/7W0Q6vz/default-avatar.png'"><div class="message-content"><div class="user" style="color:${userColor}">${sanitize(msg.user)}${isUserAdmin?'<span class="admin-badge">ADMIN</span>':''}</div>${msg.replyTo&&!msg.deleted?`<div style="font-size:0.85rem;color:var(--text-muted);background:rgba(255,255,255,.05);padding:6px 10px;border-left:3px solid var(--accent-primary);margin-bottom:6px;border-radius:6px;">${sanitize(msg.replyTo)}</div>`:""}<div>${safeText}</div><div class="timestamp">${time}</div>${!msg.deleted&&(msg.userId===user.uid||isAdmin(user.email))?`<div class="message-actions"><button class="delete-btn" onclick="deleteMessage('${data.key}')" title="Hapus Pesan"><i class="fas fa-trash"></i></button></div>`:""}</div>`;if(!msg.deleted){msgDiv.addEventListener("click",()=>{replyTo=`${msg.user}: ${msg.text}`;messageInput.placeholder=`Balas ke: ${msg.user}`;document.getElementById("replyUser").textContent=msg.user;document.getElementById("replyText").textContent=msg.text;document.getElementById("replyPreview").style.display="block";messageInput.focus()})}messagesDiv.appendChild(msgDiv);if(isUserAtBottom)scrollToBottom();if(messagesDiv.children.length>100)messagesDiv.removeChild(messagesDiv.firstChild)});const typingStatusRef=ref(db,"typing");onChildAdded(typingStatusRef,handleTypingUpdate);onChildChanged(typingStatusRef,handleTypingUpdate);function handleTypingUpdate(snapshot){const data=snapshot.val();if(!data||data.user===user.displayName)return;if(data.typing){typingDiv.textContent=`${data.user} sedang mengetik...`;typingDiv.style.cssText="color:var(--text-secondary);font-size:.9rem;padding:8px 16px;background:var(--bg-tertiary);border-radius:var(--border-radius-sm);margin:0 16px 8px;max-width:max-content;animation:fadeIn .3s ease"}else{typingDiv.textContent="";typingDiv.style.cssText=""}}window.scrollToBottom=function(){messagesDiv.scrollTop=messagesDiv.scrollHeight};window.sendMessage=function(){if(sending)return;const text=messageInput.value.trim();if(text==="")return;sending=true;setTimeout(()=>sending=false,500);push(messagesRef,{user:user.displayName,userId:user.uid,email:user.email,photoURL:user.photoURL,text,timestamp:Date.now(),replyTo:replyTo});messageInput.value="";messageInput.style.height="46px";messageInput.placeholder="Ketik pesan...";replyTo=null;document.getElementById("replyPreview").style.display="none";setTimeout(scrollToBottom,100);set(ref(db,"typing/"+user.uid),{user:user.displayName,typing:false,timestamp:Date.now()})};window.cancelReply=function(){replyTo=null;messageInput.placeholder="Ketik pesan...";document.getElementById("replyPreview").style.display="none"};window.deleteMessage=function(messageId){if(!confirm("Apakah Anda yakin ingin menghapus pesan ini?"))return;const messageRef=ref(db,`chat/${messageId}`);update(messageRef,{deleted:true,text:"Pesan ini telah dihapus"})}}</script></body></html>
